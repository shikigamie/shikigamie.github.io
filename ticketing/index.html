#drawer{position:fixed;top:0;bottom:0;left:0;width:260px;max-width:82%;background:var(--card);border-right:1px solid var(--bd);transform:translateX(-100%);transition:transform .2s;z-index:5;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px;overflow:auto}
#drawer.open{transform:none}#drawer h3{margin:4px 8px 12px;font-size:18px}
#drawer button.it{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 8px;font-size:16px}#drawer button.it:hover{background:var(--hl)}
#drawer label,#drawer p{display:block;margin:14px 8px 0;font-size:13px;color:var(--mut)}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
#panel{display:none;max-height:44vh;overflow:auto}.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.ph b{font-size:16px}
.sec{display:none;font-size:14px}.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
code{background:var(--hl);padding:1px 6px;border-radius:5px;font:13px "Courier New",monospace}
.ok{color:var(--ok)}.bad{color:var(--bad)}#res div{margin-top:3px}
.hint{margin:0 0 4px 18px;font-size:13px;color:var(--mut)}.tw{overflow-x:auto}table{border-collapse:collapse;font-size:13px;width:100%}th,td{border:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}th{background:var(--hl)}td.a{background:var(--hl)}td.a code{cursor:pointer}
#term{background:#0b0f14;border-radius:10px;border:1px solid #1d2a3a;font:13px/1.45 "Courier New",ui-monospace,Menlo,monospace;color:#7CFC9A}
#out{height:40vh;min-height:220px;overflow:auto;padding:10px}#out div{white-space:pre-wrap;word-break:break-word}
.cmd{color:#9fd0ff}.err{color:#ff8b8b}.dim{color:#7a8aa0}.exp{color:#e8c872}
.row{display:flex;align-items:center;border-top:1px solid #1d2a3a}.row span{padding-left:10px}
#in{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:16px "Courier New",ui-monospace,monospace;padding:10px;outline:0;text-transform:uppercase;-webkit-user-select:text;user-select:text}
.foot{color:var(--mut);font-size:12px;margin:6px 2px}
#gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 20px}
.gc{max-width:680px;width:100%;background:var(--card);border:2px solid var(--bad);border-radius:12px;padding:16px}.gc h2{margin:8px 0;font-size:20px;color:var(--bad)}.gc ol{padding-left:20px;font-size:14px}.gc li{margin-bottom:8px}.gc label{display:flex;gap:8px;align-items:flex-start;margin:12px 0;font-weight:600}
#wm{position:fixed;inset:0;z-index:50;pointer-events:none}
@media (min-width:900px){#main.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}#panel{max-height:76vh}#out{height:62vh}}
@media print{body>*{display:none!important}body::before{content:"Pencetakan dinonaktifkan / Printing is disabled - SAMPLE";display:block;font:24px Arial;padding:40px}}

['refund',['Refund tiket','Refund ticket'],['Mengembalikan uang tiket yang belum terpakai sesuai aturan tarif. Ada potongan (di simulator: 10% + IDR 100.000 per tiket). Itinerari ikut dibatalkan.','Returns the money for an unused ticket under the fare rules. A deduction applies (in the simulator: 10% + IDR 100,000 per ticket). The itinerary is cancelled too.'],'REFUND'],
['reissue',['Reissue (ubah tanggal)','Reissue (change date)'],['Menerbitkan ulang tiket dengan jadwal baru: REISSUE nomor-segmen tanggal-baru. Ada biaya perubahan (simulator: IDR 250.000 per tiket, bayi tidak dihitung) dan nomor tiket baru; nomor lama tercatat di baris FO.','Reissues the ticket with a new schedule: REISSUE segment-number new-date. A change fee applies (simulator: IDR 250,000 per ticket, infants not counted) and new ticket numbers are created; the old numbers are kept on FO lines.'],'REISSUE 2 {D}'],
['nextday',['Maju 1 hari (simulasi)','Advance 1 day (simulation)'],['Hanya di simulator: memajukan hari agar kamu bisa mencoba aturan void (hanya hari yang sama) dan refund.','Simulator only: advances the day so you can try the void rule (same day only) and refund.'],'NEXTDAY']];
function doIssue(){const al=S.segs[0].al,p=S.fare.rows,tn=()=>Array.from({length:10},()=>Math.floor(Math.random()*10)).join('');S.fa=[];
S.names.forEach(n=>{S.fa.push(`FA PAX ${TC[al]}-${tn()}/ET${al}/IDR${p.find(x=>x.t===(n.chd?'CHD':'ADT')).tt}/${tstr}/JKT1A0001`);if(n.inf)S.fa.push(`FA INF ${TC[al]}-${tn()}/ET${al}/IDR${p.find(x=>x.t==='INF').tt}/${tstr}/JKT1A0001`)});S.fp='CASH/IDR';S.fv=al;S.tk={type:'OK'};S.issueDay=S.simDay}
function preIssued(x){const s=x.s;S.names=s.n.map(text=>({text,chd:text.includes('(CHD/'),inf:text.includes('(INF/')}));
S.segs=s.g.map(([f,t,d])=>{const dt=resolve(d.slice(0,2),d.slice(2)),a=mkAvail(f,t,dt).L[0];return{al:a.al,no:a.no,cls:'Y',date:d,dow:dow(dt),from:f,to:t,dep:a.dep,arr:a.arr,n:s.q,st:'HK'}});
S.aps=['CGK '+x.ph+' - A'];S.rf='DINA';S.rl='QWE789';S.fare=price();doIssue();S.issueDay=x.pi}
const LS={get(){try{return JSON.parse(localStorage.getItem('ltk')||'{}')}catch(e){return{}}},set(o){try{localStorage.setItem('ltk',JSON.stringify(o))}catch(e){}}};
const dkey=fmt(today)+today.getFullYear(),tkey=i=>`${dkey}#${ver}:${i}`;
function progRender(){const d=LS.get(),dn=d.done||[],tk=d.tries||0,td=dn.filter(k=>k.startsWith(dkey+'#')).length,days=new Set(dn.map(k=>k.split('#')[0])).size,pc=Math.min(100,Math.round(td/11*100));
$('#prog').innerHTML=`<p>${tr('pg_t',td)}</p><div style="height:10px;background:var(--hl);border-radius:5px"><div style="width:${pc}%;height:10px;background:var(--ok);border-radius:5px"></div></div><p>${tr('pg_a',dn.length,days)}</p><p>${tr('pg_c',tk,tk?Math.round(dn.length/tk*100):0)}</p>`}
$('#pgr').onclick=()=>{LS.set({});progRender();loadTasks()};
function loadTasks(){TK=genTasks(dkey+'#'+ver);const dn=LS.get().done||[];sel.innerHTML='';TK.forEach((x,i)=>sel.add(new Option(`${dn.includes(tkey(i))?'✓ ':''}${i+1}. ${x.t}`,i)));$('#tdate').textContent=tr('t_date',tstr)+(ver?` #${ver+1}`:'');sel.onchange()}
$('#chk').onclick=()=>{const x=TK[sel.value],s=x.s,r=[];let all=true;
const add=(ok,t,h)=>{if(!ok)all=false;r.push(`<div class="${ok?'ok':'bad'}">${ok?'✓':'✗'} ${t}</div>${!ok&&h?`<div class="hint">💡 ${h}</div>`:''}`)};
if(s.kind==='void')add(S.voided&&!S.fa.length&&!S.refunded,tr('c_v'),tr('h_v'));
else if(s.kind==='refund')add(S.refunded&&S.refundAmt>0,tr('c_rf'),tr('h_rf'));
else if(s.kind==='reis'){const g=S.segs[1];add(!!g&&g.date===s.nd&&g.st==='HK'&&S.fo.length>0&&S.fa.length>0,tr('c_ri',2,s.nd),tr('h_ri',s.nd))}
else{add(!!S.rl&&!S.dirty,tr('c_s'),tr('h_s'));
const bad=S.names.filter(n=>!s.n.includes(n.text)).map(n=>n.text),miss=s.n.filter(y=>!S.names.some(n=>n.text===y));
add(S.names.length===s.n.length&&!miss.length,tr('c_n'),(S.names.length!==s.n.length?tr('h_nc',S.names.length,s.n.length)+' ':'')+(bad.length?tr('h_nm',bad.join(' | ')):tr('h_nmm',miss.length)));
s.g.forEach(([a,b,d])=>{const g=S.segs.find(y=>y.from===a&&y.to===b&&y.date===d);add(!!g&&g.st==='HK'&&g.n===s.q&&g.cls==='Y',tr('c_g',a,b,d,s.q),!g?tr('h_g0',a,b,d):g.st!=='HK'?tr('h_gs',g.st):g.n!==s.q?tr('h_gq',g.n,s.q):tr('h_gc'))});
add(S.segs.length===s.g.length,tr('c_k'),tr('h_k',S.segs.length,s.g.length));add(S.aps.some(a=>a.replace(/\D/g,'').includes(s.p)),tr('c_p'),tr('h_p'));add(!!S.rf,tr('c_r'),tr('h_r'));
if(s.tix)add(S.fa.length>0&&S.tk&&S.tk.type==='OK',tr('c_t'),tr('h_t'));else add(!!S.tk&&S.tk.type==='TL'&&S.tk.date===ttl,tr('c_l',ttl),tr('h_l',ttl))}
const d=LS.get();d.tries=(d.tries||0)+1;d.done=d.done||[];if(all&&!d.done.includes(tkey(sel.value))){d.done.push(tkey(sel.value));const o=sel.options[sel.value];o.text='✓ '+o.text}LS.set(d);
$('#res').innerHTML=r.join('')+(all?`<p class="ok"><b>${tr('ok_all')}</b></p>`:'')};
$('#sol').onclick=()=>{const x=TK[sel.value],s=x.s;let c=[];
if(s.kind==='void')c=['VOID'];else if(s.kind==='refund')c=['REFUND'];else if(s.kind==='reis')c=['REISSUE 2 '+s.nd];
else{if(x.pre)c.push('IG');s.g.forEach(([f,t,d])=>c.push(build(G,'avail',[d.slice(0,2),d.slice(2),f,t]),build(G,'sell',[s.q,'Y',1])));s.n.forEach(n=>c.push(build(G,'name',[n])));c.push(build(G,'phone',['CGK '+x.ph+' - A']),build(G,'ttl',[ttl]),build(G,'rf',['WISNU']),build(G,'save'));if(s.tix)c.push(build(G,'fare'),build(G,'tkt'))}
$('#res').innerHTML=`<p>${tr('sol_h')}</p>`+c.map(z=>`<div><code>${z}</code></div>`).join('')};
applyLang();exTable();setG('AMA');openS('tut');print(tr('w_hi',tstr),'dim');
